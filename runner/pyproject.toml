[project]
name = "agentrunner"
version = "0.1.0"
description = "A minimal agent runner that verifies before it acts."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["countersigned", "anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentrunner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
